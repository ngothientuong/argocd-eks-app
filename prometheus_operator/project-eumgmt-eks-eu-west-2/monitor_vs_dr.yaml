### ALERT MANAGER
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: alertmanager-vs
  namespace: prometheus
spec:
  gateways:
    - public-gateway.istio-system.svc.cluster.local
    - mesh
  hosts:
    - tngo-eks-alertmanager-mgmt-eu.bylightsdc.bylight.com
  http:
  - appendHeaders:
      x-envoy-max-retries: "10"
      x-envoy-retry-on: gateway-error,connect-failure,refused-stream
      x-envoy-upstream-rq-timeout-ms: "15000"
    route:
    ## This could work without DestinationRule
    # - destination:
    #     host: prometheus-community-kube-alertmanager
    #     port:
    #       number: 9093
    #   weight: 100
    ### Tim
    - destination:
        host: prometheus-community-kube-alertmanager   ## Service name in spec.host in DR
        subset: alertmanager-ss   ## Match with name of subsets[*].name in DR
      weight: 100      
---
kind: DestinationRule
apiVersion: networking.istio.io/v1beta1
metadata:
  name: alertmanager-dr
  namespace: prometheus
spec:
  host: prometheus-community-kube-alertmanager
  subsets:
    - labels:
        app.kubernetes.io/name: alertmanager
      name: alertmanager-ss
    ### Label of canary set  
    # - labels:
    #     version: v2.0
    #   name: subsetname2-in-destination.subset
---
