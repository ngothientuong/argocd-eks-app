apiVersion: v1
kind: Service
metadata:
    istio: gateway
  name: istio-gateway
  namespace: istio-system
spec:
  ports:
  - name: status-port
    nodePort: 30999
    port: 15021
    protocol: TCP
    targetPort: 15021
  - name: http2
    nodePort: 30139
    port: 80
    protocol: TCP
    targetPort: 80
  - name: https
    nodePort: 31135
    port: 443
    protocol: TCP
    targetPort: 443
  selector:
    app: istio-gateway
    istio: gateway
  sessionAffinity: None
  type: NodePort