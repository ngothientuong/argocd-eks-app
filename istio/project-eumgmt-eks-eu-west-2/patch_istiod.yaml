apiVersion: apps/v1
kind: Deployment
metadata:
  name: istiod
  namespace: istio-system
spec:
  replicas: 3
  template:
    spec:
      hostNetwork: true
      containers:
      - args:
        name: discovery
        ports:
          - containerPort: 8080   
            hostPort: 8090      # Change port so won't be conflict with others
            protocol: TCP
          - containerPort: 15010
            hostPort: 15010
            protocol: TCP
          - containerPort: 15017
            hostPort: 15017
            protocol: TCP    