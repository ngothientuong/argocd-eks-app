# Test Sample service against pod in cluster 1
while true; do kubectl exec --context="${CLUSTER1}" -n sample -c sleep \
    "$(kubectl get pod --context="${CLUSTER1}" -n sample -l \
    app=sleep -o jsonpath='{.items[0].metadata.name}')" \
    -- curl -sS helloworld.sample:5000/hello ; done 

