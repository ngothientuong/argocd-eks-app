helmCharts:
## Helm chart for deploying Istio cluster resource...
- name: base  # Name of the chart
  repo: https://istio-release.storage.googleapis.com/charts
  version: #
  releaseName: istio
  namespace: istio-system
  valuesFile: base.values.yaml
  includeCRDs: true ## default is false
## Helm chart for istio control plane
- name: istiod  # Name of the chart
  repo: https://istio-release.storage.googleapis.com/charts
  version: #
  releaseName: istio
  namespace: istio-system
  valuesFile: istiod.values.yaml
  includeCRDs: true ## default is false
## Helm chart for istio ingress gateway
- name: gateway  # Name of the chart
  repo: https://istio-release.storage.googleapis.com/charts
  version: #
  releaseName: istio
  namespace: istio-ingress
  valuesFile: gateway.values.yaml
  includeCRDs: true ## default is false  


