## Resource for Gateway
resources:
  requests:
    cpu: 50m     # Default 100m
    memory: 64Mi  # Default 128Mi 
  limits:
    cpu: 500m     # Default 2000m 
    memory: 512Mi  # Default 1024Mi

service:
  # Type of service. Set to "None" to disable the service entirely
  type: NodePort
  ports:
  - name: status-port
    port: 15021
    protocol: TCP
    targetPort: 15021
    nodePort: 30999    
  - name: http2
    port: 80
    protocol: TCP
    targetPort: 80
  - name: https
    port: 443
    protocol: TCP
    targetPort: 443
    nodePort: 31135 # Hardcoded to use with ALB
  annotations: {}
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  externalTrafficPolicy: ""
  externalIPs: []    