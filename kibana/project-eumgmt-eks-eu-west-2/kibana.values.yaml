---
elasticsearchHosts: "https://elasticsearch-master:9200"
elasticsearchCertificateSecret: elasticsearch-master-certs
elasticsearchCertificateAuthoritiesFile: ca.crt
elasticsearchCredentialSecret: elasticsearch-master-credentials



# replicas: 1
### Tim
replicas: 2

podAnnotations: 
  eks.amazonaws.com/role-arn: arn:aws:iam::682331604648:role/project/project-eumgmt-eks-eu-west-2-openid_connect_role
  iam.amazonaws.com/role: project-eumgmt-eks-eu-west-2-openid_connect_role  
# iam.amazonaws.com/role: es-cluster

resources:
  requests:
    cpu: "1000m"
    memory: "2Gi"
  limits:
    cpu: "1000m"
    memory: "2Gi"
