apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elastic-logstash
  namespace: elastic-system
spec:
  template:
    spec:
      containers:
      - volumeMounts:
          - mountPath: /usr/share/logstash/data
            name: elastic-logstash
            $patch: delete
          ## Change EFS mount to /usr/share/logstash
      - volumeMounts:          
          - mountPath: /usr/share/logstash
            name: elastic-logstash
