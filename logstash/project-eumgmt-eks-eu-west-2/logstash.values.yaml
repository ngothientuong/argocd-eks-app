---
replicas: 2

# Allows you to add any config files in /usr/share/logstash/config/
# such as logstash.yml and log4j2.properties
#
# Note that when overriding logstash.yml, `http.host: 0.0.0.0` should always be included
# to make default probes work.
# logstashConfig: {}
#  logstash.yml: |
#    key:
#      nestedkey: value
#  log4j2.properties: |
#    key = value
logstashConfig: 
  logstash.yml: |
    xpack.monitoring.enabled: true
    xpack.monitoring.elasticsearch.hosts: [ "https://elasticsearch-master:9200" ]
    xpack.monitoring.elasticsearch.username: "elastic" 
    xpack.monitoring.elasticsearch.password: "2NPZCPQ2sjdXme67"
    xpack.monitoring.elasticsearch.ssl.verification_mode: none
    path.data: /usr/share/logstash/data
    pipeline.workers: 4
    pipeline.batch.size: 254
    pipeline.batch.delay: 90
    pipeline.unsafe_shutdown: false
    pipeline.ordered: auto
    path.config: /usr/share/logstash/config
    config.test_and_exit: false
    config.reload.automatic: true
    config.reload.interval: 3s
    config.debug: true
    log.level: trace
    queue.type: memory
    path.queue: /usr/share/logstash/queue
    queue.page_capacity: 64mb
    queue.max_events: 0
    queue.max_bytes: 1024mb
    queue.checkpoint.acks: 1024
    queue.checkpoint.writes: 1024
    queue.checkpoint.interval: 1000
    dead_letter_queue.enable: false
    log.level: info
    path.logs: /usr/share/logstash/data/logs    

# Allows you to add any pipeline files in /usr/share/logstash/pipeline/
### ***warn*** there is a hardcoded logstash.conf in the image, override it first
logstashPipeline:
  logstash.conf: |
   input {
     exec {
       command => "uptime"
       interval => 30
     }
   }
   output { stdout { } }
  dummy-01.conf: |
    input { stdin{} }  
    filter { }
    output { stdout { codec => "rubydebug" } }
  filebeat-02.conf: |
    input {
      beats {
        port => 5044
      }
    }
    filter { 
      json {
        source => "message"
        target => "message"
      }
    } 
    output { 
      elasticsearch {               
        ssl => false 
        ssl_certificate_verification => false
        index => "%{[@metadata][beat]}-%{[@metadata][version]}-%{+YYYY.MM.dd}"
        hosts => [ "https://elasticsearch-master:9200" ]
      stdout { 
          codec => rubydebug 
        }        
      }   
### For filebeat input above
#        ssl => true
#        ssl_certificate => "/usr/share/filebeat/certs/tls.crt"
#        ssl_key => "/usr/share/filebeat/certs/tls.key"
## This line might be needed for output.elasticsearch above
      # hosts => ["https://<NodeIP1>:9200","https://<NodeIP2>:9200","https://<NodeIP3>:9200"]                 
      # user => "elastic" 
      # password => "2NPZCPQ2sjdXme67" 



