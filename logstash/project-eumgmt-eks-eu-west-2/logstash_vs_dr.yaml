### logstash
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: logstash-vs
  namespace: elastic-system
spec:
  gateways:
    - public-gateway.istio-system.svc.cluster.local
    - mesh
  hosts:
    - tngo-eks-logstash-mgmt-eu.bylightsdc.bylight.com
  http:
  # - appendHeaders:
  #     x-envoy-max-retries: "10"
  #     x-envoy-retry-on: gateway-error,connect-failure,refused-stream
  #     x-envoy-upstream-rq-timeout-ms: "15000"
  #   route:
  - route:
    ## This could work without DestinationRule
    # - destination:
    #     host: prometheus-community-kube-logstash
    #     port:
    #       number: 9093
    #   weight: 100
    ### Tim
    - destination:
        host: elastic-logstash   ## Service name in spec.host in DR
        subset: logstash-ss   ## Match with name of subsets[*].name in DR
        port:
          number: 8080
      weight: 100      
---
kind: DestinationRule
apiVersion: networking.istio.io/v1alpha3
metadata:
  name: logstash-dr
  namespace: elastic-system
spec:
  host: elastic-logstash
  subsets:
    - labels:
        app: logstash
      name: logstash-ss
    ### Label of canary set  
    # - labels:
    #     version: v2.0
    #   name: subsetname2-in-destination.subset
---
