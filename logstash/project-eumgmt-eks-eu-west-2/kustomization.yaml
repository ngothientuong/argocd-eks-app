apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
## No Logstash UI available. Access via Kiabana
resources:
- logstash_svc.yaml
- logstash_vs_dr.yaml
helmCharts:
- name: logstash  # Name of the chart
  repo: https://helm.elastic.co
  version: #
  releaseName: elastic
  namespace: elastic-system
  valuesFile: logstash.values.yaml  
  includeCRDs: true
## FILEBEAT  
## Needs FileBeat to collect logs. Logstash will fail to start without pipeline config
## No change in filebeat for now, including hostNetwork: false
- name: filebeat  # Name of the chart
  repo: https://helm.elastic.co
  version: #
  releaseName: elastic
  namespace: elastic-system
  valuesFile: filebeat.values.yaml  
  includeCRDs: true
