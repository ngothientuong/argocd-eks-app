apiVersion: jaegertracing.io/v1
kind: Jaeger
metadata:
  labels:
    jaegertracing.io/operated-by: observability.jaeger-operator
  name: jaeger-prod-stragtegy
  namespace: observability
spec:
  strategy: production
  collector:
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 10%
    maxReplicas: 2
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
  storage:
    type: elasticsearch
    # nodeCount: 3
    # dependencies:
    #   enabled: true                                 # turn the job deployment on and off
    #   schedule: "55 23 * * *"                       # cron expression for it to run
    #   sparkMaster:                                  # spark master connection string, when empty spark runs in embedded local mode
    #   resources:
    #     requests:
    #       memory: 4096Mi
    #     limits:
    #       memory: 4096Mi    
    esIndexCleaner:
      enabled: true
      numberOfDays: 7
      schedule: "55 23 * * *"
    options:
      # log-level: debug
      # memory: 100000
      # cpu: 2
      es:
        #server-urls: https://elasticsearch-master.elastic-system:9200
        server-urls: [ "https://elasticsearch-master.elastic-system:9200" ]
        index-prefix: jaeger_
        create-index-templates: false
        tls.enabled: true
        tls.ca: /es/certificates/tls.crt
        version: 8
    secretName: elasticsearch-master-credentials
  ingress:
    enabled: false
  volumeMounts: 
    - name: certificates
      mountPath: /es/certificates/
      readOnly: true
  volumes:
    - name: certificates
      secret:
        secretName: elasticsearch-master-certs