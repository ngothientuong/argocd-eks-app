apiVersion: jaegertracing.io/v1
kind: Jaeger
metadata:
  labels:
    jaegertracing.io/operated-by: observability.jaeger-operator
  name: jaeger-prod-stragtegy
  namespace: observability
spec:
  strategy: production
  options: 
    log-level: debug
  collector:
    strategy:
      type: RollingUpdate
      rollingUpdate: 
        maxSurge: 10%  
    maxReplicas: 2
    resources:
      limits:
        cpu: 100m
        memory: 128Mi  
  storage:
    type: elasticsearch 
    nodeCount: 1 
    dependencies:
      enabled: true                                 # turn the job deployment on and off
      schedule: "55 23 * * *"                       # cron expression for it to run
      sparkMaster:                                  # spark master connection string, when empty spark runs in embedded local mode
      resources:
        requests:
          memory: 4096Mi
        limits:
          memory: 4096Mi    
    esIndexCleaner:
      enabled: true                                # // turn the cron job deployment on and off
      numberOfDays: 7                              # // number of days to wait before deleting a record
      schedule: "55 23 * * *"                      # // cron expression for it to run    
    options:
      memory: 100000
      cpu: 2
      es:
        server-urls: https://elasticsearch-master.elastic-system.svc:9200 
        index-prefix: jaeger-prefix
        tls: 
          ca: /es/certificates/ca.crt
    secretName: elasticsearch-master-credentials
  ingress:
    enabled: false
  volumeMounts: 
    - name: certificates
      mountPath: /es/certificates/
      readOnly: true
  volumes:
    - name: certificates
      secret:
        secretName: elasticsearch-master-certs