apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali-backend-connection
  namespace: kiali-operator
spec:
  external_services:
    prometheus:
      auth:
        insecure_skip_verify: false
        type: none
        use_kiali_token: false
      cache_duration: 7
      cache_enabled: true
      cache_expiration: 300
      url: "http://prometheus-community-kube-prometheus.prometheus:9090/"
    tracing:
      auth:
        # insecure_skip_verify: false 
        ### Tim
        insecure_skip_verify: true
        type: none
        use_kiali_token: false
      enabled: true
      ### Need to update this once jaeger installed
      in_cluster_url: "http://jaeger-prod-stragtegy-query.observability:16686/"  
      use_grpc: false 
      url: 'https://tngo-eks-jaequery-mgmt-eu.bylightsdc.bylight.com'
      #is_core_component: false
      namespace_selector: true
      whitelist_istio_system:
      - observability
      - istio-gateway      
### GRAFANA
    grafana:
      auth:
        ca_file: ''
        # insecure_skip_verify: false    ## Test with true, meaning connecting insecurely.
        insecure_skip_verify: true
        password: 'prom-operator'
        token: ''
        type: none
        use_kiali_token: false
        username: 'admin'
      dashboards:
      - name: Istio Service Dashboard
        variables:
          namespace: var-namespace
          service: var-service
      - name: Istio Workload Dashboard
        variables:
          namespace: var-namespace
          workload: var-workload
      enabled: true
      in_cluster_url: "http://prometheus-community-grafana.prometheus"
      #is_core_component: false
      url: 'http://prometheus-community-grafana.prometheus'
### ISTIO 
    istio:
      component_status:
        components:
        - app_label: istiod
          is_core: true
          namespace: istio-system
        - app_label: istio-gateway
          is_core: true
          namespace: istio-system
        enabled: true
      config_map_name: istio
      envoy_admin_local_port: 15000
      istio_identity_domain: svc.cluster.local
      istio_injection_annotation: sidecar.istio.io/inject
      istio_sidecar_annotation: sidecar.istio.io/status
      url_service_version: "http://istiod.istio-system:15014/version"

  health_config:
    rate: []
  istio_labels:
    app_label_name: app
    injection_label_name: istio-injection
    version_label_name: version
  istio_namespace: "istio-system"
  kiali_feature_flags:
    istio_injection_action: true
  kubernetes_config:
    burst: 200
    cache_duration: 300
    # cache_enabled: true
    cache_istio_types:
    - DestinationRule
    - Gateway
    - ServiceEntry
    - VirtualService
    - Sidecar
    - PeerAuthentication
    - RequestAuthentication
    - AuthorizationPolicy
    cache_namespaces:
    - .*
    cache_token_namespace_duration: 10
    excluded_workloads: 
    qps: 999