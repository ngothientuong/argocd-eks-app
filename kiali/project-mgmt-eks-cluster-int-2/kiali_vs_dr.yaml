### KIALI
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: kiali-vs
  namespace: kiali-operator
spec:
  gateways:
    - public-gateway.istio-system.svc.cluster.local
    - mesh
  hosts:
    - tngo-eks-kiali-mgmt-eu.bylightsdc.bylight.com
  http:
  # - appendHeaders:
  #     x-envoy-max-retries: "10"
  #     x-envoy-retry-on: gateway-error,connect-failure,refused-stream
  #     x-envoy-upstream-rq-timeout-ms: "15000"
  #   route:
  - route:
    ## This could work without DestinationRule
    # - destination:
    #     host: prometheus-community-kube-kiali
    #     port:
    #       number: 9093
    #   weight: 100
    ### Tim
    - destination:
        host: kiali   ## Service name in spec.host in DR
        subset: kiali-ss   ## Match with name of subsets[*].name in DR
        port:
          number: 20001
      weight: 100      
---
kind: DestinationRule
apiVersion: networking.istio.io/v1alpha3
metadata:
  name: kiali-dr
  namespace: kiali-operator
spec:
  host: kiali
  subsets:
    - labels:
        app.kubernetes.io/name: kiali
      name: kiali-ss
    ### Label of canary set  
    # - labels:
    #     version: v2.0
    #   name: subsetname2-in-destination.subset
---
