secretGenerator:
- name: ca.crt
  files:
  - ../../common_files/ca.crt
resources:
- cert.yaml
- admission-configuration.yaml
- crds.tpl.yaml
- deploy.tpl.yaml
- kustomization.yaml
- rbac.tpl.yaml
- webhook_rbac.tpl.yaml
- wehook.tpl.yaml
