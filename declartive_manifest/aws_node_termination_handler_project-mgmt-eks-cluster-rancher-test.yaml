apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-node-termination-handler-project-mgmt-eks-cluster-rancher-test
  # You'll usually want to add your resources to the argocd namespace.
  namespace: argocd
  # Add a this finalizer ONLY if you want these to cascade delete.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # The project the application belongs to.
  project: default
  source:
    repoURL: 'git@github.com:ngothientuong/argocd-eks-app.git'
    path: aws_node_termination_handler/project-mgmt-eks-cluster-rancher-test
  destination:
    server: 'https://EE00B7C37FBEFD736D4DCB89D9BF09D7.sk1.us-east-2.eks.amazonaws.com'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
