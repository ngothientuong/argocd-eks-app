apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  ## Name cannot have -
  name: filebeat-project-eumgmt-eks-eu-west-2
  # You'll usually want to add your resources to the argocd namespace.
  namespace: argocd
  # Add a this finalizer ONLY if you want these to cascade delete.
  finalizers:
    #- resources-finalizer.argocd.argoproj.io
spec:
  # The project the application belongs to.
  project: default
  source:
    repoURL: 'git@github.com:ngothientuong/argocd-eks-app.git'
    path: filebeat/project-eumgmt-eks-eu-west-2
  destination:
    server: 'https://DD9C03E1D12C707818F395E287C2996B.gr7.eu-west-2.eks.amazonaws.com'
    namespace: elastic-system
  syncPolicy:
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
      - CreateNamespace=true
      #- Replace=true
      - PruneLast=false      
    retry:
      limit: 2
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m0s
