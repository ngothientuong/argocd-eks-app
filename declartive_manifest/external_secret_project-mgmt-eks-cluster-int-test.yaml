apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secret-project-mgmt-eks-cluster-int-test
  # You'll usually want to add your resources to the argocd namespace.
  namespace: argocd
  # Add a this finalizer ONLY if you want these to cascade delete.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # The project the application belongs to.
  project: default
  source:
    repoURL: 'git@github.com:ngothientuong/argocd-eks-app.git'
    path: external_secrets/project-mgmt-eks-cluster-int-test
  destination:
    server: 'https://93C08E0ADD36AFEBF2B86F0EE63F6B3B.gr7.us-east-2.eks.amazonaws.com'
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 100
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
