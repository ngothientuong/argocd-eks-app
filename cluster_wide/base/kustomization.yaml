#namespace: clustersecret
# CA certificate mount as secret but not being used in resources
secretGenerator:
- files:
  - common_files/awspca_root.crt
  name: awspca-root.crt
resources:
- awspca_cluster_issuer.yaml
- generic_app_cert.yaml
- istio_gateway.yaml
- cluster_secret_rbac.yaml
- cluster_secret_crd.yaml
- cluster_secret_deploy.yaml
- dockerhub_registry.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization