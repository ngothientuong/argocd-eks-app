---
kind: Certificate
apiVersion: cert-manager.io/v1
metadata:
  name: snapshot-validation-cert
  namespace: kube-system
spec:
  commonName: snapshot-validation-service # Has to match with service name or Ingress's spec.tls.hosts
  dnsNames:    # Has to match with service name or Ingress's spec.tls[*].hosts
    - snapshotter.com
  #duration: 2160h0m0s
  issuerRef:
    group: awspca.cert-manager.io
    kind: AWSPCAClusterIssuer
    name: tngo-eks-ca
  renewBefore: 360h0m0s
  secretName: snapshot-validation-secret  # Has to match with the secret mounted in deployment by Ingress's spec.tls[*].hosts.secretName
  usages:
    - server auth
    - client auth
  privateKey:
    algorithm: RSA
    size: 2048