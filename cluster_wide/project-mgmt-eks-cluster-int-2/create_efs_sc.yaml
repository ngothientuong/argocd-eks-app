kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
# ## Added
reclaimPolicy: Retain
allowVolumeExpansion: true
mountOptions:
  # - tls
  - iam    ## Required for EFS CSI or else volume failed to be mounted.
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-0d2cb4585a9d03683    ## Specific to region/zone
  directoryPerms: "700"
  gidRangeStart: "1000" # optional
  gidRangeEnd: "2000" # optional
  basePath: "/dynamic_provisioning/int-2" # optional